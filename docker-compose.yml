services:
  storage:  
    image: minio/minio
    container_name: storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fileconverter
      MINIO_ROOT_PASSWORD: DevPassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

  sqldb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqldb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqldb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  broker:
    image: rabbitmq:4-management
    container_name: broker
    hostname: broker
    environment:
      RABBITMQ_DEFAULT_USER: fileconverter
      RABBITMQ_DEFAULT_PASS: DevPassword123!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - broker_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  converter-api:
    build:
      context: "./Api"
      dockerfile: Dockerfile
    container_name: converter-api
    ports:
      - "5194:8080"
    environment:
      - DatabaseConfig__DefaultConnection=Server=sqldb;Database=FileConverter;User Id=sa;Password=DevPassword123!;TrustServerCertificate=True
      - ObjectStorageConfig__Endpoint=http://storage:9000
      - ObjectStorageConfig__AccessKey=fileconverter
      - ObjectStorageConfig__SecretKey=DevPassword123!
      - ObjectStorageConfig__WithSSL=false
      - RabbitMq__HostName=broker
      - RabbitMq__Port=5672
      - RabbitMq__UserName=fileconverter
      - RabbitMq__Password=DevPassword123!
      - InternalApi__Key=LocalWorkerKey123!
    depends_on:
      broker:
        condition: service_healthy
      sqldb:
        condition: service_healthy
      storage:
        condition: service_started

  converter-worker:
    build:
      context: "./Converter" 
    container_name: converter-worker
    environment:
      - RABBITMQ_HOST=broker
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=fileconverter
      - RABBITMQ_PASSWORD=DevPassword123!
      - API_BASE_URL=http://converter-api:8080
      - INTERNAL_API_KEY=LocalWorkerKey123!
      - MINIO_ENDPOINT=storage:9000
      - MINIO_ACCESS_KEY=fileconverter
      - MINIO_SECRET_KEY=DevPassword123!
      - MINIO_BUCKET=user-files
    depends_on:
      broker:
        condition: service_healthy
      storage:
        condition: service_started
      converter-api:
        condition: service_started

  frontend:
    build:
      context: "./Frontend"
      dockerfile: Dockerfile
    container_name: converter-frontend
    ports:
      - "3000:80"
    depends_on:
      - converter-api
  
volumes:
  broker_data:
  storage_data:
  sqldb_data:
